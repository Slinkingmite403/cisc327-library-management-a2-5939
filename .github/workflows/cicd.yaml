name: CICD

on:
  push:
  pull_request:


jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.14.0"
          - "3.13.9"
          - "3.13.8"
          - "3.13.7"
          - "3.13.6"
          - "3.13.5"
          - "3.12.0"
          - "3.11.0"
          - "3.10.0"
          - "3.9.0"
          - "3.8.0"
          - "3.7.1"
       

    name: Test
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest
          
